<!doctype html>
<html lang="it" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: necessario perche' env(safe-area-inset-*) abbia effetto su iPhone -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="Dashboard di monitoring del homelab" />

    <!-- iOS non legge il manifest per l'icona della schermata Home: vuole queste. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- black-translucent: la pagina passa sotto la status bar, ci pensa la safe-area -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Homelab Hub" />

    <title>Homelab Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
