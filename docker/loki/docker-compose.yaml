services:
  loki:
    # Digest pin (no version label upstream).
    image: grafana/loki@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    container_name: loki
    restart: unless-stopped
    user: root
    ports:
      - "3100:3100"
    volumes:
      - /volume1/docker/loki/config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - /volume1/docker/loki/data:/loki
    command: -config.file=/etc/loki/loki-config.yaml

  promtail:
    # Digest pin (upstream version label is a build id, not semver).
    image: grafana/promtail@sha256:6cfa64ec432b24a912d640e2edb940eeae2666f61861a66c121d763dd7241381
    container_name: promtail
    restart: unless-stopped
    user: root
    volumes:
      - /volume1/docker/promtail/config/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
