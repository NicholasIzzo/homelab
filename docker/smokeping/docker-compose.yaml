services:
  smokeping:
    image: lscr.io/linuxserver/smokeping:2.9.0-r0-ls169
    container_name: smokeping
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - /volume1/docker/smokeping/config:/config
      - /volume1/docker/smokeping/data:/data
    ports:
      - "8008:80"
    restart: unless-stopped
