services:
  jellyseerr:
    # Digest pin (upstream ships :latest / :develop, no version tags).
    image: fallenbagel/jellyseerr@sha256:4538137bc5af902dece165f2bf73776d9cf4eafb6dd714670724af8f3eb77764
    container_name: jellyseerr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Rome
    ports:
      - "5055:5055"
    volumes:
      - /volume1/docker/jellyseerr/config:/app/config
