services:
  crowdsec:
    # Digest pin (no version label upstream).
    image: crowdsecurity/crowdsec@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
    container_name: crowdsec
    environment:
      - PGID=1000
      - COLLECTIONS=crowdsecurity/nginx-proxy-manager
    volumes:
      - /volume1/docker/crowdsec/config:/etc/crowdsec
      - /volume1/docker/crowdsec/data:/var/lib/crowdsec/data
      - /volume1/docker/nginx-proxy-manager:/var/log/npm:ro
    restart: unless-stopped

  cs-bouncer:
    image: fbonalair/traefik-crowdsec-bouncer:0.5.0
    container_name: cs-bouncer
    environment:
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_BOUNCER_API_KEY}
      - CROWDSEC_AGENT_HOST=crowdsec:8080
      - GIN_MODE=release
    restart: unless-stopped
    depends_on:
      - crowdsec
