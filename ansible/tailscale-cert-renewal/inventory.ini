# Nessun host NAS in questo inventory, ed è intenzionale.
#
# La chiave SSH usata per raggiungere il NAS è ristretta con `command=` in
# authorized_keys (vedi remote/authorized_keys.snippet e T2 nella mappa
# wayfinder): qualunque comando il client chieda, il server esegue sempre
# e solo lo script fisso. Questo è incompatibile con il modo normale in cui
# Ansible parla SSH con un host — deve poter eseguire payload arbitrari
# (moduli Python serializzati, trasferimenti sftp) per ogni singolo task.
#
# Il NAS quindi non è modellato come host d'inventario: il playbook gira
# su questa stessa macchina (Semaphore) e raggiunge il NAS con un singolo
# comando `ssh` esplicito dentro un task. Vedi README.md per i dettagli.

localhost ansible_connection=local
